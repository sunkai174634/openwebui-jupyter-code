services:
  jupyter-code:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/openwebui-jupyter-code:latest
    container_name: openwebui-jupyter-code
    restart: unless-stopped
    ports:
      # Change the host port to fit your convention (e.g. 33024 on a NAS).
      - "8888:8888"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      JUPYTER_ENABLE_LAB: "yes"
    command:
      - start-notebook.py
      - --ServerApp.ip=0.0.0.0
      - --ServerApp.port=8888
      - --ServerApp.token=${JUPYTER_TOKEN}
      - --ServerApp.password=
      - --ServerApp.allow_origin=*
      - --ServerApp.disable_check_xsrf=False
      - --ServerApp.root_dir=/home/jovyan/work
    volumes:
      - ./work:/home/jovyan/work
    mem_limit: 3g
    cpus: "2.0"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/api/kernels?token=' + os.environ.get('JUPYTER_TOKEN', ''), timeout=5).read(32)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
